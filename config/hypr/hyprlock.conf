# ~/.config/hypr/hyprlock.conf — ImpulseShell Material 3 Lock Screen
general {
    hide_cursor = true
    grace = 2
}

background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 8
    brightness = 0.72
}

label {
    monitor =
    text = $TIME
    color = rgb(e6eaea)
    font_size = 76
    font_family = JetBrainsMono Nerd Font Bold
    position = 0, 110
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %B %d"
    color = rgb(b3c1c0)
    font_size = 18
    font_family = JetBrainsMono Nerd Font
    position = 0, 35
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 280, 48
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.25
    outer_color = rgb(b8d5d3)
    inner_color = rgba(1e2423cc)
    font_color = rgb(e6eaea)
    fade_on_empty = false
    rounding = 16
    placeholder_text = <span foreground="##b3c1c0">Unlock ImpulseShell...</span>
    position = 0, -55
    halign = center
    valign = center
}
