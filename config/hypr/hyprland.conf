# ~/.config/hypr/hyprland.conf — ImpulseShell (Nyx + Myx) Real Linux Wayland DE
# Wallpaper Preset: Obsidian Silk | M3 Seed: #76B0AB (Dark)
# Shell Mode: Material 3 Top Bar | Material: frosted_glass

# === Monitors (Auto-fallback catches any connected display) ===
monitor = , preferred, auto, 1
monitor = eDP-1, 2560x1600@144, 0x0, 1
monitor = DP-1, disable

# === Environment Variables ===
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland
env = QT_QPA_PLATFORM,wayland;xcb
env = QT_QPA_PLATFORMTHEME,qt6ct
env = GDK_BACKEND,wayland,x11,*
env = SDL_VIDEODRIVER,wayland
env = MOZ_ENABLE_WAYLAND,1
env = ELECTRON_OZONE_PLATFORM_HINT,auto
env = XCURSOR_SIZE,24

# === Core ImpulseShell Daemons ===
exec-once = waybar
exec-once = swaync
exec-once = swww-daemon && sleep 0.4 && swww img ~/.config/impulse/wallpaper.png --transition-type grow --transition-fps 60
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store
exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1 || /usr/libexec/polkit-gnome-authentication-agent-1 || hyprpolkitagent
exec-once = nm-applet --indicator
# exec-once = hyprsunset -t 4200
# exec-once = hypridle
exec-once = command -v nwg-dock-hyprland >/dev/null && nwg-dock-hyprland -d -i 38 -mb 10

# === General & Borders ===
general {
    gaps_in = 6
    gaps_out = 14
    border_size = 2
    col.active_border = rgb(b8d5d3) rgb(bcbdd2) 45deg
    col.inactive_border = rgba(39464588)
    resize_on_border = true
    allow_tearing = false
    layout = dwindle
}

# === Input & Gestures ===
input {
    kb_layout = us
    follow_mouse = 0
    sensitivity = 0
    touchpad {
        natural_scroll = true
        tap-to-click = true
    }
}

gestures {
    workspace_swipe = true
    workspace_swipe_fingers = 3
}

# === Tabbed Window Groups ===
group {
    col.border_active = rgb(b8d5d3)
    col.border_inactive = rgba(39464588)
    groupbar {
        enabled = true
        font_family = JetBrainsMono Nerd Font
        font_size = 11
        height = 20
        col.active = rgb(3d5c59)
        col.inactive = rgb(1e2423)
        text_color = rgb(e6eaea)
    }
}

# === Layout Engines ===
dwindle {
    pseudotile = false
    preserve_split = true
    default_split_ratio = 1.16
}

master {
    new_status = master
    mfact = 0.58
}

# === Surface Material, Rounding, Blur & Shadows ===
decoration {
    rounding = 16
    active_opacity = 0.74
    inactive_opacity = 0.75
    dim_inactive = false
    dim_strength = 0.16

    shadow {
        enabled = true
        range = 20
        render_power = 3
        color = rgba(00000055)
    }

    blur {
        enabled = true
        size = 23
        passes = 3
        new_optimizations = true
        xray = false
        noise = 0.03
        vibrancy = 0.16
    }
}

# === Layer Shell Blur (Mixie Island / Waybar / SwayNC / Fuzzel) ===
layerrule = blur, waybar
layerrule = ignorezero, waybar
layerrule = blur, swaync-control-center
layerrule = blur, swaync-notification-window
layerrule = ignorezero, swaync-control-center
layerrule = ignorezero, swaync-notification-window
layerrule = blur, launcher
layerrule = ignorezero, launcher

# === Animations ===
animations {
    enabled = true
    bezier = impulse, 0.05, 0.9, 0.1, 1.05
    animation = windows, 1, 4, impulse, popin 86%
    animation = windowsOut, 1, 4, impulse, popin 86%
    animation = border, 1, 6, default
    animation = fade, 1, 4, impulse
    animation = workspaces, 1, 5, impulse, slide
    animation = specialWorkspace, 1, 4, impulse, slidevert
}

misc {
    force_default_wallpaper = 0
    disable_hyprland_logo = true
    disable_splash_rendering = true
    vrr = 1
}

# === Window Rules ===
windowrulev2 = suppressevent maximize, class:.*
windowrulev2 = float, class:^(pavucontrol|blueman-manager|nm-connection-editor)$
windowrulev2 = opacity 0.95 0.95, class:^(myx-notes)$
windowrulev2 = workspace 3, class:^(btop-rs)$

# === Keybindings ===
$mainMod = SUPER
$altMod = ALT

# Core Apps & ImpulseShell Overlays
bind = $altMod, SPACE, exec, pgrep -x fuzzel >/dev/null && pkill fuzzel || fuzzel
bind = $mainMod, SPACE, exec, pgrep -x fuzzel >/dev/null && pkill fuzzel || fuzzel
bind = $mainMod, RETURN, exec, kitty
bind = $altMod, RETURN, exec, kitty
bind = $mainMod, E, exec, nautilus || thunar || dolphin || kitty -e yazi
bind = $mainMod, B, exec, firefox || chromium || xdg-open https://
bind = $mainMod, N, exec, swaync-client -t -sw
bind = $altMod, N, exec, swaync-client -t -sw
bind = $mainMod, L, exec, hyprlock
bind = $mainMod, V, exec, cliphist list | fuzzel --dmenu -p "Clipboard " | cliphist decode | wl-copy
bind = $mainMod SHIFT, S, exec, impulse-screenshot region
bind = , PRINT, exec, impulse-screenshot full
bind = $mainMod SHIFT, P, exec, impulse-picker
bind = $mainMod SHIFT, N, exec, impulse-sunset

# Window Management (Hyprland Parity)
bind = $mainMod, Q, killactive,
bind = $altMod, Q, killactive,
bind = $mainMod, F, togglefloating,
bind = $mainMod SHIFT, F, fullscreen, 0
bind = $mainMod, M, fullscreen, 1
bind = $mainMod, P, pseudo,
bind = $mainMod, J, togglesplit,
bind = $mainMod, G, togglegroup,
bind = $mainMod, TAB, changegroupactive, f
bind = $altMod, TAB, cyclenext,
bind = $mainMod, S, togglespecialworkspace, scratchpad
bind = $mainMod SHIFT, D, movetoworkspace, special:scratchpad

# Focus & Move (Arrow Keys + Vim Keys)
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d
bind = $mainMod, H, movefocus, l
bind = $mainMod, K, movefocus, u

# Workspaces 1..9 + Scroll Wheel
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Mouse Move / Resize Floating & Tiled Windows
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Media, Volume & Brightness Hardware Keys
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1.5 @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPrev, exec, playerctl previous
bindel = , XF86MonBrightnessUp, exec, brightnessctl set +5%
bindel = , XF86MonBrightnessDown, exec, brightnessctl set 5%-
